services:
  web:
    build: .
    image: quitting-time
    restart: unless-stopped
    ports:
      # 호스트의 nginx 만 접근하도록 localhost 에만 바인딩 (외부 직접 노출 시 "3000:3000")
      - "127.0.0.1:3000:3000"
    volumes:
      # 일 단위 서버 로그 보존. 확인: docker compose exec web ls logs
      - logs:/app/logs

volumes:
  logs:
